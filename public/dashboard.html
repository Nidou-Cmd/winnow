<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Winnow - Zero-Trust FinOps Dashboard</title>
  <style>
    :root {
      --bg: #070B11;
      --surface: rgba(15, 23, 42, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #8B5CF6;
      --accent-glow: rgba(139, 92, 246, 0.25);
    }
    body {
      margin: 0; padding: 0; font-family: 'Inter', sans-serif;
      background: var(--bg); color: #F8FAFC;
      display: flex; height: 100vh;
    }
    aside {
      width: 250px; background: rgba(0,0,0,0.5); border-right: 1px solid var(--border);
      padding: 24px; box-sizing: border-box;
    }
    .logo {
      font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 40px;
    }
    .logo span { color: var(--accent); }
    nav a {
      display: block; padding: 12px; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 8px;
    }
    nav a:hover, nav a.active {
      background: rgba(255,255,255,0.05); color: #fff;
    }
    main {
      flex: 1; padding: 40px; overflow-y: auto;
    }
    .glass-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      backdrop-filter: blur(20px); padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
    .metric { text-align: center; }
    .metric-title { font-size: 13px; color: #94A3B8; margin-bottom: 8px; }
    .metric-val { font-size: 32px; font-weight: 800; color: #fff; font-family: monospace; }
    .status-badge {
      display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.4); color: #34D399;
    }
  </style>
</head>
<body>
  <aside>
    <div class="logo"><span>W</span> winnow</div>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="#">Cost Explorer</a>
      <a href="#">Anomalies</a>
      <a href="settings.html">Settings (API)</a>
    </nav>
  </aside>
  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h1 style="margin: 0; font-size: 24px;">Zero-Trust API Gateway</h1>
      <button style="background: #8B5CF6; border: none; padding: 10px 20px; border-radius: 8px; color: #fff; font-weight: 600;">Run Anomaly Scan</button>
    </div>

    <div class="glass-panel">
      <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px;">
        <h2 style="margin: 0; font-size: 16px;">API Gateway: Zero-Trust Overview</h2>
        <div class="status-badge">System Secure</div>
      </div>
      <div class="grid-3">
        <div class="metric">
          <div class="metric-title">API Usage (24h)</div>
          <div class="metric-val" style="color: #38BDF8;">2.1M</div>
        </div>
        <div class="metric">
          <div class="metric-title">Security Score</div>
          <div class="metric-val" style="color: #10B981;">98/100</div>
        </div>
        <div class="metric">
          <div class="metric-title">Auth Success Rate</div>
          <div class="metric-val" style="color: #F8FAFC;">99.8%</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
