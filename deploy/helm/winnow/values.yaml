replicaCount: 2

image:
  repository: ghcr.io/nidou-cmd/winnow
  pullPolicy: IfNotPresent
  tag: "2.0.0"

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  NODE_ENV: production
  IN_VPC_MODE: "true"
  ZERO_DATA_EXFILTRATION: "true"
  DEFAULT_DISCOUNT_PERCENT: "0"

persistence:
  enabled: true
  storageClass: "gp3"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: finops.internal.corp
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: winnow-internal-tls
      hosts:
        - finops.internal.corp
